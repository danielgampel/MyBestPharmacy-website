name: Deploy to SiteGround
on:
  push:
    branches:
      - main
jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Clear FTP sync state (force full re-sync)
        run: |
          curl --ssl-reqd \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --quote "DELE /mybest-pharmacy.com/public_html/.ftp-deploy-sync-state.json" \
            ftp://${{ secrets.FTP_SERVER }}/ || true

      - name: Upload files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /mybest-pharmacy.com/public_html/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            fable/**
            **/temporary screenshots/**
            README.md
            CLAUDE.md
            CONTEXT.md
            LEARNINGS.md
            package.json
            package-lock.json
            serve.mjs
            screenshot.mjs
            Pharmacy Website.code-workspace
            .DS_Store
            **/.DS_Store
